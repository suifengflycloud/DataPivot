server:
  port: 8081

spring:
  application:
    name: datapivot-server
  # 项目自身配置库（存储连接配置/同步任务/映射关系/执行记录），支持环境变量注入，不硬编码生产口令
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DP_DB_URL:jdbc:mysql://127.0.0.1:3306/datapivot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DP_DB_USER:root}
    password: ${DP_DB_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 10000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      break-after-acquire-failure: false
      filters: stat
  jackson:
    # LocalDateTime 序列化为标准格式，空对象不报错
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    # SQL 日志走 Slf4j（开发期可将 com.datapivot.mapper 设为 DEBUG 查看）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

datapivot:
  # 数据库连接密码 AES 加密密钥（生产环境务必通过环境变量覆盖）
  crypto:
    aes-key: ${DP_AES_KEY:DataPivot@2026#Key}
  sync:
    # 同步进度日志环形缓冲条数
    max-log-lines: 300
    # 执行记录中 error_log 字段最大保存字符数
    max-error-log-chars: 60000

xxl:
  job:
    # 总开关：不需要定时任务功能时可置为 false，完全不初始化执行器
    enabled: ${XXL_JOB_ENABLED:true}
    admin:
      # 调度中心地址（部署建议：docker run -d -p 8280:8080 xuxueli/xxl-job-admin:2.4.0）
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8280/xxl-job-admin}
      username: ${XXL_JOB_ADMIN_USER:admin}
      password: ${XXL_JOB_ADMIN_PASSWORD:123456}
    # 需与调度中心 AccessToken 一致
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: ${XXL_JOB_APPNAME:datapivot-executor}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ./logs/xxl-job
      logretentiondays: 30

logging:
  level:
    com.datapivot: info
